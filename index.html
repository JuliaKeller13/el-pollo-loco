<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="./assets/img/sombrero.png" />
    <title>El Pollo Loco</title>
  </head>
  <body onload="openStartScreen()">
    <h1>El Pollo Loco</h1>
    <main>
      <section class="game-container">
        <canvas id="canvas" width="800" height="480"></canvas>

        <div class="ingame-ui">
          <button onclick="toggleFullscreen()" class="icon-button">
            <img
              id="fullscreenButton"
              src="./assets/img/fullscreen.png"
              alt="Mute"
            />
          </button>
          <button onclick="toggleMute()" class="icon-button">
            <img
              id="muteIcon"
              src="./assets/img/9_intro_outro_screens/ton.png"
              alt="Mute"
            />
          </button>
          <button onclick="openInfo()" class="icon-button">Info</button>
        </div>

        <div class="mobile-controls">
          <div class="control-group">
            <button
              id="btnLeft"
              class="mobile-button"
              touch-action="manipulation"
            >
              <img src="./assets/img/arrow-left.png" alt="left button" />
            </button>
            <button
              id="btnRight"
              class="mobile-button"
              touch-action="manipulation"
            >
              <img src="./assets/img/arrow-rightt.png" alt="right button" />
            </button>
          </div>
          <div class="control-group">
            <button
              id="btnJump"
              class="mobile-button"
              touch-action="manipulation"
            >
              <img src="./assets/img/jump.png" alt="left button" />
            </button>
            <button
              id="btnThrow"
              class="mobile-button"
              touch-action="manipulation"
            >
              <img
                src="./assets/img/6_salsa_bottle/bottle_rotation/1_bottle_rotation.png"
                alt="bottle"
              />
            </button>
          </div>
        </div>

        <dialog id="startScreen" class="start-screen">
          <img
            src="./assets/img/9_intro_outro_screens/startscreen_1.png"
            class="screen-bg"
          />
          <div class="dialog-content">
            <button class="button" id="startButton" onclick="startGame()">
              START GAME
            </button>
            <button class="button secondary" onclick="openImpressum()">
              IMPRESSUM
            </button>
          </div>
        </dialog>

        <dialog id="infoScreen" class="info-screen">
          <div class="dialog-content">
            <div class="control-info">
              <p>
                Left and Right:<br/>
                <img src="./assets/img/arrow-left.png" alt="left"/>
                <img src="./assets/img/arrow-rightt.png" alt="right"/><br/>
                Jump: Space<br/>
                Throw: c
              </p>
              <button class="button" onclick="closeInfo()">OK</button>
            </div>
          </div>
        </dialog>

        <dialog id="endScreen" class="end-screen">
          <div class="dialog-content">
            <div id="statusMessage"></div>
            <button class="button" id="restartButton" onclick="restartGame()">
              RESTART
            </button>
          </div>
        </dialog>

        <dialog id="impressumScreen" class="info-screen">
          <div class="dialog-content">
            <div class="control-info impressum-content">
              <h2>Impressum</h2>
              <p>
                <strong>Angaben gemäß § 5 TMG:</strong><br/>
                Julia Keller<br/>
                Bremsheide 185<br/>
                58638 Iserlohn<br/><br/>
                <strong>Kontakt:</strong><br/>
                E-Mail: juliakeller.vk@gmail.com<br/><br/>
                <strong>Haftungsausschluss:</strong><br/>
                Dies ist ein Lernprojekt.<br/>
                Alle Inhalte dienen ausschließlich Bildungszwecken.
              </p>
              <button class="button" onclick="closeImpressum()">SCHLIESSEN</button>
            </div>
          </div>
        </dialog>
      </section>
    </main>

    <script src="./scripts/audio.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/background-objekt.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/statusbars/statusbar.class.js"></script>
    <script src="./models/statusbars/statusbar-health.class.js"></script>
    <script src="./models/statusbars/statusbar-coin.class.js"></script>
    <script src="./models/statusbars/statusbar-bottle.class.js"></script>
    <script src="./models/statusbars/statusbar-endboss-health.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./scripts/game.js"></script>
  </body>
</html>
